<title>ひだまり荘 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 夜のボロアパート：暗い廊下に、在室中の窓だけが灯る。単一のダークテーマで固定 */
:root{
  --ink:#17181f; --panel:#22232d; --panel2:#2b2c38; --line:#3c3d4b;
  --paper:#ece5d6; --muted:#9e99a8; --lamp:#f0b257; --lamp-dim:#8a6328;
  --roof:#3b2d2b; --good:#8fc79a; --bad:#e2867a; --scrim:rgba(8,8,12,.72);
  --display:'Dela Gothic One','Zen Maru Gothic','Hiragino Sans',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
#hdr{display:flex;align-items:center;gap:10px;padding-block:4px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day{font-family:var(--display);font-size:20px;line-height:1}
.day small{font-family:var(--body);font-size:12px;margin-left:2px;color:var(--muted)}
.dow{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pip{font-size:12px;padding:1px 7px;border-radius:4px;color:var(--muted);border:1px solid var(--line)}
.pip.now{background:var(--lamp);color:var(--ink);border-color:var(--lamp);font-weight:700}
.pip.past{opacity:.35}
.money{margin-left:auto;font-weight:700}
.icon{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:30px;cursor:pointer}

main{flex:1;min-height:0;overflow-y:auto;padding-block:14px}

/* message */
.msg{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px 12px;min-height:88px;position:relative}
.who{font-size:12px;font-weight:700;color:var(--lamp)}
.txt.narr{color:var(--muted)}
.more{position:absolute;right:12px;bottom:6px;color:var(--lamp);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#tap{position:fixed;inset:0;z-index:20;cursor:pointer}
#block{position:fixed;inset:0;z-index:19;background:var(--scrim);opacity:.45}
.msg.choosing{z-index:21;border-color:var(--lamp)}
.who.me{color:var(--paper)!important;opacity:.75}
.choices{display:grid;gap:6px;margin-top:10px}
.pickbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;line-height:1.45}
.pickbtn:hover{border-color:var(--lamp)}
.pickbtn::before{content:'▸ ';color:var(--lamp)}

/* building */
.bldg{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.roof{background:var(--roof);padding:10px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.roof b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.06em}
.floor{display:grid;grid-template-columns:22px repeat(4,1fr);gap:6px;padding:8px}
.floor+.floor{border-top:1px dashed var(--line)}
.flabel{writing-mode:vertical-rl;font-size:11px;color:var(--muted);align-self:center;letter-spacing:.2em}
.door{aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:6px;padding:6px;text-align:left;cursor:pointer;min-width:0}
.door .no{font-size:11px;color:var(--muted)}
.door .win{height:24px;border-radius:2px;background:var(--ink);border:1px solid var(--line)}
.door.lit .win{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 16px var(--lamp-dim)}
.door .nm{font-size:12px;line-height:1.3;word-break:break-all}
.door.self{border-color:var(--lamp-dim)}
.door.empty{opacity:.5}
.bldg.mansion{margin-bottom:12px}
.bldg.mansion .roof{background:var(--panel2)}
.bldg.mansion .door{aspect-ratio:4/5}
.heart{color:var(--bad);margin-right:2px}
.badge{font-size:10px;line-height:1.5;padding:0 5px;border-radius:3px;background:var(--lamp);color:var(--ink);align-self:flex-start}
.badge.off{background:none;color:var(--muted);border:1px solid var(--line)}
.chip.cap{border-color:var(--bad);color:var(--bad)}
.desc{font-size:11px;color:var(--muted);line-height:1.5}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.stats{display:grid;gap:10px;margin-top:16px}
.stat{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lamp)}
.bar.full i{background:var(--good)}
.bar.low i{background:var(--bad)}

/* room */
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 2px;letter-spacing:.03em;text-wrap:balance}
.sub{font-size:12px;color:var(--muted)}
.portrait{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:start}
.figbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;aspect-ratio:2/3;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.figbox img{width:100%;height:100%;object-fit:cover}
.figbox svg{width:100%;height:100%}
.figbox .tag{position:absolute;top:4px;left:4px;font-size:10px;color:var(--muted);background:var(--ink);padding:0 4px;border-radius:3px}
.info{display:grid;gap:7px;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.chip.like{border-color:var(--good);color:var(--good)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.btn small{color:var(--muted);font-size:11px;line-height:1.4}
.btn:disabled{opacity:.36;cursor:default}
.btn.primary{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
.btn.primary small{color:var(--ink);opacity:.75}
.btn.wide{grid-column:1/-1}
.back{margin-top:14px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;font-size:13px}

/* title */
.title{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:24px}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--lamp)}
.title h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.1;margin:0;letter-spacing:.06em}
.title p{margin:0;color:var(--muted);max-width:30em}
.stack{display:grid;gap:8px;max-width:320px}

/* modal */
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:86%;overflow-y:auto;border-radius:14px 14px 0 0;border:1px solid var(--line);border-bottom:none;
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:17px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--muted);font-size:11px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.nrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.up{color:var(--lamp)}
textarea{width:100%;min-height:90px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:8px}
.sheet .close{margin-top:14px;width:100%}
.dev{display:grid;gap:6px}
.dev .rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
</style>

<div id="app">
  <header id="hdr" hidden></header>
  <main id="main"></main>
  <div class="msg" id="msg" aria-live="polite"></div>
</div>
<div id="tap" hidden aria-label="次へ"></div>
<div id="block" hidden></div>
<div id="modal" hidden></div>

<script src="data.js"></script>
<script src="heroines.js"></script>
<script src="scenes.js"></script>
<script>
(() => {
'use strict';
const D = window.GAME_DATA, C = D.config;
const SAVE_KEY = 'hidamari_save_v1';
const H = Object.fromEntries(D.heroines.map(h => [h.id, h]));
const bldOf = h => h.building || 'apartment';
const BY_ROOM = {};   // 'apartment:102' → [ヒロイン…]（双子は同じ部屋に2人）
D.heroines.forEach(h => { (BY_ROOM[bldOf(h) + ':' + h.room] = BY_ROOM[bldOf(h) + ':' + h.room] || []).push(h); });
const MAN = C.mansion || {};
// マンションの住人は、マンションが建つまで登場しない
const active = h => {
  if (bldOf(h) === 'mansion' && !(S && S.mansionBuilt)) return false;
  const a = h.appearIf;   // 登場条件（莉緒：ひなたが段階9以上）
  if (a && S && !(S.h[a.heroine] && S.h[a.heroine].stage >= (a.minStage || 1)) && !(S.h[h.id] && S.h[h.id].arrived)) return false;
  if (a && S && S.h[h.id]) S.h[h.id].arrived = true;   // 一度来たら、条件が外れても居続ける
  return true;
};
const HS = () => D.heroines.filter(active);
const rentOf = h => h.rent || (bldOf(h) === 'mansion' ? MAN.rentPerMonth : C.rentPerMonth) || C.rentPerMonth;
const FOOD = Object.fromEntries(D.foods.map(f => [f.id, f]));
const $ = s => document.querySelector(s);

let S = null, screen = 'title';
let Q = [], incoming = [], settled = true, flushPending = false;
let modalKind = null, shopBought = false, nightReport = null;

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slotName = () => C.slots[S.slot];
const dateOf = day => { const d = new Date((C.startDate || '2026-04-01') + 'T00:00:00'); d.setDate(d.getDate() + day - 1); return d; };
const dow = () => (dateOf(S.day).getDay() + 6) % 7;
const isMonthEnd = () => dateOf(S.day + 1).getDate() === 1;
const dateText = () => { const d = dateOf(S.day); return `${d.getMonth() + 1}/${d.getDate()}`; };
const favorable = st => st.captured || st.aff >= C.favorableFrom;
const canVisit = st => st.captured || st.aff >= C.visitMinAffection;
const mod = (h, k) => (h.mods && h.mods[k] != null ? h.mods[k] : 1);
const isWeekend = () => dow() >= 5;
const bmi = (h, w) => w / ((h.height / 100) ** 2);
const stageOf = (h, w) => { const b = bmi(h, w); return (D.stages.find(s => b < s.maxBmi) || D.stages[D.stages.length - 1]).id; };
const stageInfo = id => D.stages.find(s => s.id === id);
const tierOf = aff => { let t = 0; D.affectionTiers.forEach((x, i) => { if (aff >= x.min) t = i; }); return t; };
const present = h => (h.schedule[isWeekend() ? 'weekend' : 'weekday'] || []).includes(slotName());
const schedText = h => `平日 ${h.schedule.weekday.join('・')}／休日 ${h.schedule.weekend.join('・')}`;
const maxW = h => (h && h.maxWeight) || C.maxWeight || 120;
const invCount = () => Object.values(S.inv).reduce((a, b) => a + b, 0);

/* ---------- 体のサイズ・服・節目（1kg単位の変化） ---------- */
const CS = C.clothingSizes || [];
const fatOf = h => (h.bodyType && h.bodyType.fat) || 'hidden';
const rateOf = h => h.sizeRates || (h.bodyType && C.sizeRates && C.sizeRates[h.bodyType.frame + '_' + h.bodyType.fat]) || { bust: 0.7, waist: 1.1, hip: 0.85 };
function measure(h, w) {
  if (!h.sizes) return null;
  const s = h.sizes, r = rateOf(h), d = w - h.weight;
  const w39 = (C.waistExtraFromBmi || 39) * (h.height / 100) ** 2;
  const extra = Math.max(0, w - Math.max(h.weight, w39));
  return { bust: s.bust + r.bust * d, under: s.under + (C.underRate || 0.45) * d,
    waist: s.waist + r.waist * d + (C.waistExtra || 0.2) * extra, hip: s.hip + r.hip * d };
}
const CUPS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const cupOf = m => { const i = Math.round((m.bust - m.under - 10) / 2.5); return i < 0 ? 'AA' : CUPS[Math.min(i, CUPS.length - 1)]; };
const fitIdx = (part, v) => { const i = CS.findIndex(c => c[part] >= v); return i < 0 ? CS.length - 1 : i; };
const needTop = m => fitIdx('bust', m.bust);
const needBottom = m => Math.max(fitIdx('waist', m.waist), fitIdx('hip', m.hip));
function tightText(h, st) {
  const m = measure(h, st.weight); if (!m || !st.clothes) return '';
  if (fatOf(h) === 'hidden' && st.stage < 4) return C.tightness[0].text;
  const top = CS[st.clothes.top], bot = CS[st.clothes.bottom], f = fatOf(h);
  const room = f === 'apple' ? bot.waist - m.waist : f === 'pear' ? bot.hip - m.hip
    : ((top.bust - m.bust) + (bot.waist - m.waist) + (bot.hip - m.hip)) / 3;
  const row = C.tightness.find(r => room >= r.min) || C.tightness[C.tightness.length - 1];
  return row.text.replace('{part}', (C.tightPart || {})[f] || '服');
}
function progressText(h, st) {
  const i = D.stages.findIndex(s => s.id === st.stage), cur = D.stages[i], prev = D.stages[i - 1], next = D.stages[i + 1];
  if (!next || !D.stageProgress) return '';
  const lo = prev ? prev.maxBmi : bmi(h, h.weight), b = bmi(h, st.weight);   // 段階1は初期体重から数える
  const pos = (b - lo) / Math.max(0.1, cur.maxBmi - lo);
  const tpl = pos < 0.5 ? (prev ? D.stageProgress.early : '') : D.stageProgress.late;
  return tpl.replace('{name}', cur.name).replace('{next}', next.name);
}
// 体重を教えてくれるか：show / hidden / refuse / whisper
function weightReveal(h, st) {
  if (S.devShowAll || st.captured) return 'show';
  const r = C.weightReveal || {};
  if (tierOf(st.aff) < (r.minTier ?? 2)) return 'hidden';
  const inR = a => a && st.stage >= a[0] && st.stage <= a[1];
  if (inR(r.refuseStages)) return 'refuse';
  if (inR(r.whisperStages)) return 'whisper';
  return 'show';
}
const PRIO = { weight100: 9, ratio2: 9, clothesUp: 6 };
// 同じ種類の節目は最新のものだけ残す（体重・増加量・肥満度・服）
const evGroup = k => (k === 'weight100' ? k : k.replace(/\d+$/, ''));
function queueEvent(st, key, vars) {
  st.pend = (st.pend || []).filter(e => evGroup(e.key) !== evGroup(key));
  st.pend.push({ key, vars, prio: PRIO[key] || 3, day: S.day });
}
// 夜の集計で、節目を越えたかを調べてイベントを積む
function checkMilestones(h, st, from, to) {
  const ms = C.milestones || {}, done = st.ms = st.ms || [];
  const hit = (id, key, vars) => { if (!done.includes(id)) { done.push(id); queueEvent(st, key, vars); } };
  (ms.weights || []).forEach(k => { if (to >= k && from < k) hit('w' + k, k === 100 ? 'weight100' : 'weight', { kg: k }); });
  (ms.gainFromStart || []).forEach(g => { if (to - h.weight >= g) hit('g' + g, 'gain', { gain: g }); });
  (ms.ratioToStart || []).forEach(r => { if (to >= h.weight * r) hit('r' + r, r >= 2 ? 'ratio2' : 'ratio15', { kg: Math.round(to) }); });
  (ms.bmi || []).forEach(b => { if (bmi(h, to) >= b) hit('b' + b, 'bmi' + b, {}); });
  const m = measure(h, to);
  if (m) {
    (ms.waist || []).forEach(w => { if (m.waist >= w) hit('wa' + w, 'waist' + w, {}); });
    const f = fatOf(h);
    if ((f === 'apple' && m.waist > m.bust) || (f === 'pear' && m.hip - m.bust >= 20)) hit('rev', 'reverse', {});
    // 服のサイズアップ（隠れ肥満は段階4まで見た目に出ない）
    if (st.clothes && !(f === 'hidden' && st.stage < 4)) {
      const nt = Math.max(st.clothes.top, needTop(m)), nb = Math.max(st.clothes.bottom, needBottom(m));
      if (nt > st.clothes.top || nb > st.clothes.bottom) {
        const up = nb > st.clothes.bottom ? 'bottom' : 'top';
        const prev = CS[st.clothes[up]].name;
        st.clothes = { top: nt, bottom: nb };
        queueEvent(st, 'clothesUp', { size: CS[st.clothes[up]].name, prev });
      }
    }
  }
  // 古くなった節目は捨てる（同じ種類は最新だけ・最大6件）
  st.pend.sort((a, b) => b.prio - a.prio || b.day - a.day);
  st.pend = st.pend.slice(0, 6);
}
function milestoneLine(h, key) {
  const ML = D.milestoneLines || {}, own = h.lines.milestone && h.lines.milestone[key];
  const fat = ML.byFat && ML.byFat[fatOf(h)] && ML.byFat[fatOf(h)][key];
  return Object.assign({}, ML[key] || {}, fat || {}, own || {});
}
// 訪問時に、たまっている節目イベントを1つ出す
function playMilestone(h, st) {
  if (!st.pend || !st.pend.length) return false;
  const n = C.eventsPerVisit || 1;
  st.pend.splice(0, n).forEach(ev => {
    const L = milestoneLine(h, ev.key); if (!L) return;
    const fill = s => String(s || '').replace(/\{(\w+)\}/g, (_, k) => ev.vars && ev.vars[k] != null ? ev.vars[k] : '');
    if (L.narr) narr(fill(L.narr));
    const txt = favorable(st) ? L.high : L.low;
    if (txt) say(h.name, fill(txt), h.color);
  });
  return true;
}
function sinceLastText(st) {
  if (st.lastSeenW == null) return '';
  const d = st.weight - st.lastSeenW;
  const row = (C.sinceLast || []).find(r => d >= r.min);
  return row ? row.text : '';
}

/* ---------- messages ---------- */
function say(name, text, color) {
  incoming.push({ name, text, color });
  if (!flushPending) { flushPending = true; queueMicrotask(flush); }
}
const narr = t => say('', t);
function line(h, key) {
  const capt = S.h[h.id].captured && h.lines[key + 'Captured'];
  const src = capt || h.lines[key] || (D.commonLines || {})[key];
  if (!src || !src.length) return '……';
  if (Array.isArray(src[0])) return pick(src[Math.min(tierOf(S.h[h.id].aff), src.length - 1)]);
  return pick(src);
}
const speak = (h, key) => say(h.name, line(h, key), h.color);
function flush() {
  flushPending = false;
  if (!incoming.length) return;
  // 読み終えた最後のメッセージは新しいメッセージで置き換える。ただし時間が進んだ直後は、まだ読んでいる最中なので後ろにつなげる
  Q = settled && !keepLast ? incoming : Q.concat(incoming);
  incoming = []; settled = false; drawMsg();
}
// Q の要素は { name, text, color } か、選択肢 { choice: {...} }
function drawMsg() {
  const box = $('#msg');
  let m = Q[0];
  if (!m) { box.innerHTML = '<div class="txt narr">　</div>'; box.classList.remove('choosing'); $('#tap').hidden = true; $('#block').hidden = true; settled = true; if (waitingAdvance) queueMicrotask(tryAdvance); return; }
  const ch = m.choice ? m : (Q[1] && Q[1].choice ? Q[1] : null);
  const line = m.choice ? null : m;
  const more = !ch && Q.length > 1;
  let html = '';
  if (line) html += (line.name ? `<div class="who ${line.me ? 'me' : ''}" style="color:${esc(line.color || '')}">${esc(line.name)}</div>` : '') +
    `<div class="txt ${line.name ? '' : 'narr'}">${esc(line.text)}</div>`;
  else if (ch.choice.prompt) html += `<div class="txt narr">${esc(ch.choice.prompt)}</div>`;
  if (ch) html += `<div class="choices">${ch.choice.list.map((c, i) => `<button class="pickbtn" data-act="pick" data-i="${i}">${esc(c.text)}</button>`).join('')}</div>`;
  if (more) html += '<div class="more">▼ タップで次へ</div>';

/* ---------- state ---------- */
function freshHeroine(h) {
  const st = { aff: h.startAffection || 0, wary: h.startWary || 0, weight: h.weight, full: 0,
    cap: Math.round(C.baseCapacity * (h.appetite || 1)), habit: 0, intake: 0, gifts: 0,
    talked: false, ate: false, known: {}, visits: 0, captured: false, capturedDay: null };
  st.stage = stageOf(h, st.weight); st.seenStage = st.stage;
  const m = measure(h, st.weight);
  st.clothes = m ? { top: needTop(m), bottom: needBottom(m) } : null;
  st.ms = []; st.pend = []; st.lastSeenW = null;
  return st;
}
function newState() {
  const s = { v: 1, day: 1, slot: 0, money: C.startMoney, building: C.startBuilding, cook: 0,
    inv: {}, uni: { went: 0, total: 0 }, uniToday: false, view: { type: 'map' }, h: {},
    packages: {}, rentDone: {}, evDone: [], seen: {}, flags: {} };
  D.heroines.forEach(h => { s.h[h.id] = freshHeroine(h); });
  return s;
}
// データ側でヒロインや項目が増えても古いセーブが動くように補う
function normalize() {
  const base = newState();
  for (const k in base) if (S[k] === undefined) S[k] = base[k];
  D.heroines.forEach(h => {
    if (!S.h[h.id]) S.h[h.id] = freshHeroine(h);
    else { const f = freshHeroine(h); for (const k in f) if (S.h[h.id][k] === undefined) S.h[h.id][k] = f[k]; }
  });
  if (S.view.type === 'room' && !H[S.view.id]) S.view = { type: 'map' };
  D.heroines.forEach(h => { const st = S.h[h.id]; st.stage = stageOf(h, st.weight); if (st.seenStage > st.stage) st.seenStage = st.stage; });
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function loadSaved() { try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
const encode = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decode = t => JSON.parse(decodeURIComponent(escape(atob(t.trim()))));

function addAff(h, d) {
  const st = S.h[h.id], t0 = tierOf(st.aff);
  st.aff = clamp(st.aff + d, 0, 100);
  const t1 = tierOf(st.aff);
  // 会話シーンの途中なら、関係の変化と攻略はシーンが終わってから出す
  const later = f => (inScene ? sceneNotes.push(f) : f());
  if (t1 > t0) later(() => narr(`（${h.name}との関係が「${D.affectionTiers[t1].name}」になった）`));
  if (!st.captured && st.aff >= C.captureAffection) { st.captured = true; later(() => { st.captured = false; capture(h); }); }
}
// 攻略イベント
function capture(h) {
  const st = S.h[h.id];
  st.captured = true; st.capturedDay = S.day; st.wary = 0;
  (h.lines.capture || (D.commonLines || {}).capture || ['……ずっと、一緒にいて']).forEach(t => say(h.name, t, h.color));
  narr(`♥ ${h.name}を攻略した！（${S.day}日目）　これからも一緒に暮らしていける。`);
  const n = D.heroines.filter(x => S.h[x.id].captured).length;
  if (!S.bankbook && n >= (MAN.unlockCaptured || 5)) {
    S.bankbook = 'ready';
    narr('（ふと、101号室に残っている祖父の荷物のことが気になった）');
  }
}
const addWary = (h, d) => { const st = S.h[h.id]; if (favorable(st) && d > 0) return; st.wary = clamp(st.wary + d, 0, 100); };
const stageLine = (h, st) => favorable(st) ? 'high' : 'low';
// 体型が上がった後のセリフ：固有 stageUp → タイプ共通の反応 → なし
function stageReaction(h, st) {
  const own = h.lines.stageUp && h.lines.stageUp[st.stage];
  if (own) return own[stageLine(h, st)];
  const fat = h.bodyType && D.typeReactions && D.typeReactions.fat[h.bodyType.fat];
  if (!fat) return null;
  const s = st.stage;
  const key = fat.s23 && (s === 2 || s === 3) ? 's23' : fat.s4 && s === 4 ? 's4' : s <= 5 ? 'early' : s <= 10 ? 'mid' : 'late';
  const r = fat[key] || fat.mid;
  return r ? r[stageLine(h, st)] : null;
}
function stretch(h) {
  const st = S.h[h.id];
  if (st.full >= st.cap * C.stretchThreshold) {
    st.cap = Math.min(C.maxCapacity, st.cap + Math.round(C.stretchOnEat * mod(h, 'stretch')));
    narr('（お腹をさすっている。少し苦しそうだ）');
  }
}

/* ---------- 序盤のイベント ---------- */
// 朝の掃除中の挨拶
function morningGreet() {
  let n = 0;
  // 住人が多いので、1回の掃除で会うのは最大 morningGreetMax 人まで（順番はランダム）
  HS().slice().sort(() => Math.random() - 0.5).forEach(h => {
    if (n >= (C.morningGreetMax || 2) || Math.random() >= C.morningGreetChance) return;
    n++;
    narr(isWeekend() ? `${h.name}がゴミ出しに出てきた。` : `${h.name}が出かけるところだった。`);
    addAff(h, C.morningGreetAffection);
    if (!tryScene(h, 'morning')) speak(h, 'greetMorning');
  });
  if (!n) narr('誰とも会わなかった。');
}
// 留守中の荷物を預かる（昼に判定）
function rollPackages() {
  HS().forEach(h => {
    if (S.packages[h.id] || present(h) || Math.random() >= C.packageChance) return;
    S.packages[h.id] = { day: S.day };
    narr(`宅配便が届いた。${h.name}は留守なので、管理人室で預かった。`);
  });
}
function deliver(h) {
  const st = S.h[h.id], late = S.day - S.packages[h.id].day >= 2;
  delete S.packages[h.id];
  narr(`${h.name}に預かっていた荷物を渡した。`);
  const isLate = late && !favorable(st);
  addAff(h, isLate ? C.packageLateAffection : C.packageAffection);
  if (!tryScene(h, 'package', { late: isLate })) speak(h, isLate ? 'packageLate' : 'packageReceive');

}
// 月末の家賃回収
function collectRent(h) {
  const st = S.h[h.id], t = tierOf(st.aff);
  const amt = Math.round(rentOf(h) * (S.building >= 50 ? 1 : 0.8));
  S.rentDone[h.id] = true; S.money += amt;
  narr(`${h.name}の部屋へ家賃を受け取りに行った。`);
  if (t === 0 && !st.captured) narr('（あまりいい顔はされなかった）');
  addAff(h, (C.rentAffection || [])[t] || 0);
  if (!tryScene(h, 'rent')) speak(h, 'rent');
  narr(`家賃 ${yen(amt)} を受け取った。` + (amt < rentOf(h) ? '（建物の状態が悪く、値引きした）' : ''));
  // 顔なじみの段階では、雑談から追加イベントに発展することがある
  if (t === 1 && !st.captured && Math.random() < C.rentEventChance) {
    if (pickScene(h, 'rentExtra')) { narr('（話が弾んで、もう少し話し込んだ）'); tryScene(h, 'rentExtra'); }
  }
  render();
}
/* ---------- 会話シーン（scenes.js） ----------
   シーン = 条件 + ノードの集まり。ノードは セリフ → 効果 → 分岐/選択肢/次へ */
const SC = window.GAME_SCENES || {};
let inScene = false, sceneNotes = [];
function endScene() { inScene = false; const n = sceneNotes; sceneNotes = []; n.forEach(f => f()); }
const PLAYER = C.playerLabel || 'あなた';
const flagsOf = h => (S.flags[h.id] = S.flags[h.id] || []);
function condOk(h, c, ctx = {}) {
  if (!c) return true;
  const st = S.h[h.id], fl = flagsOf(h), t = tierOf(st.aff);
  if (c.minAff != null && st.aff < c.minAff) return false;
  if (c.maxAff != null && st.aff > c.maxAff) return false;
  if (c.tiers && !c.tiers.includes(t)) return false;
  if (c.flag && ![].concat(c.flag).every(f => fl.includes(f))) return false;
  if (c.noFlag && [].concat(c.noFlag).some(f => fl.includes(f))) return false;
  if (c.late != null && !!ctx.late !== c.late) return false;
  if (c.weekend != null && isWeekend() !== c.weekend) return false;
  if (c.slot && !c.slot.includes(slotName())) return false;
  if (c.captured != null && !!st.captured !== c.captured) return false;
  if (c.minStage != null && st.stage < c.minStage) return false;
  if (c.maxStage != null && st.stage > c.maxStage) return false;
  if (c.minMoney != null && S.money < c.minMoney) return false;
  if (c.chance != null && Math.random() >= c.chance) return false;
  return true;
}
function pickScene(h, type, ctx = {}) {
  const list = (SC[h.id] || []).filter(sc => sc.type === type && !(sc.once && S.evDone.includes(sc.id)) && condOk(h, sc.if, ctx));
  if (!list.length) return null;
  // まだ見ていない（見た回数が少ない）シーンを優先
  const seen = sc => S.seen[sc.id] || 0, min = Math.min(...list.map(seen));
  return pick(list.filter(sc => seen(sc) === min));
}
function playScene(h, sc, ctx = {}) {
  S.seen[sc.id] = (S.seen[sc.id] || 0) + 1;
  if (sc.once) S.evDone.push(sc.id);
  inScene = true;
  if (!playNode(h, sc, sc.start || Object.keys(sc.nodes)[0], ctx)) endScene();
}
function tryScene(h, type, ctx) { const sc = pickScene(h, type, ctx); if (sc) { playScene(h, sc, ctx); return true; } return false; }
function sayLine(h, l) {
  if (typeof l === 'string') { if (l.startsWith('（')) narr(l); else say(h.name, l, h.color); return; }
  const [w, txt] = l;
  if (w === 'p') { incoming.push({ name: PLAYER, text: txt, me: true }); if (!flushPending) { flushPending = true; queueMicrotask(flush); } }
  else if (w === 'n') narr(txt);
  else say(h.name, txt, h.color);
}
function applyFx(h, o) {
  if (!o) return;
  if (o.aff) addAff(h, o.aff);
  if (o.wary) addWary(h, o.wary);
  if (o.building) S.building = clamp(S.building + o.building, 0, 100);
  if (o.money) S.money += o.money;
  if (o.habit) { const st = S.h[h.id]; st.habit = clamp(st.habit + o.habit, 0, 1); }
  if (o.setFlag) [].concat(o.setFlag).forEach(f => { if (!flagsOf(h).includes(f)) flagsOf(h).push(f); });
  if (o.clearFlag) [].concat(o.clearFlag).forEach(f => { const a = flagsOf(h), i = a.indexOf(f); if (i >= 0) a.splice(i, 1); });
}
function playNode(h, sc, id, ctx, depth = 0) {
  const n = sc.nodes[id];
  if (!n || depth > 30) return false;
  (n.say || []).forEach(l => sayLine(h, l));
  applyFx(h, n);
  if (n.branch) {
    const b = n.branch.find(b => condOk(h, b.if, ctx));
    if (b) return playNode(h, sc, b.next, ctx, depth + 1);
  }
  if (n.choices) {
    const list = n.choices.filter(c => condOk(h, c.if, ctx));
    if (list.length) {
      incoming.push({ choice: { h, sc, ctx, list, prompt: n.prompt } });
      if (!flushPending) { flushPending = true; queueMicrotask(flush); }
      return true;
    }
  }
  if (n.next) return playNode(h, sc, n.next, ctx, depth + 1);
  return false;
}
// 選択肢を選んだ：返答と続きの会話を、残りのメッセージより前に差し込む
function pickChoice(i) {
  const idx = Q[0] && Q[0].choice ? 0 : 1;
  const item = Q[idx]; if (!item || !item.choice) return;
  Q.splice(0, idx + 1);
  const { h, sc, ctx, list } = item.choice, c = list[i];
  const rest = Q; Q = []; const held = incoming; incoming = [];
  if (!c.silent) sayLine(h, c.text.startsWith('（') ? ['n', c.text] : ['p', c.line || c.text]);
  (c.say || []).forEach(l => sayLine(h, l));
  inScene = true;
  applyFx(h, c);
  const waiting = c.next ? playNode(h, sc, c.next, ctx) : false;
  if (!waiting) endScene();
  const added = incoming; incoming = held;
  Q = added.concat(rest); settled = false;
  render(); drawMsg();
}

/* ---------- time ---------- */
// 時間を進めるのは、会話（メッセージと選択肢）をすべて読み終えてから
let waitingAdvance = false, keepLast = false;
function advanceSlot() {
  if (waitingAdvance) return;
  waitingAdvance = true;
  queueMicrotask(() => queueMicrotask(tryAdvance));   // 直前に出したメッセージが表示されるのを待つ
}
function tryAdvance() {
  if (!waitingAdvance) return;
  if (!settled || incoming.length || flushPending || inScene) return;   // drawMsg が読み終わりを検知したら呼び直す
  waitingAdvance = false;
  doAdvance();
}
function doAdvance() {
  keepLast = true; queueMicrotask(() => queueMicrotask(() => { keepLast = false; }));
  S.slot++;
  if (S.slot >= C.slots.length) { night(); return; }
  if (slotName() === '昼') rollPackages();
  render();
}
function night() {
  const rep = { day: S.day, rows: [], events: [] };
  const weekday = dow() < 5;
  if (weekday) S.uni.total++;
  HS().forEach(h => {
    const st = S.h[h.id];
    const maint = st.weight * C.maintPerKg;
    const own = maint * (C.baseEatRatio + C.habitEatBonus * st.habit);
    const dW = (own + st.intake - maint) / C.kcalPerKg * C.weightGainBoost;
    const from = st.weight;
    st.weight = Math.min(maxW(h), Math.round((st.weight + dW) * 100) / 100);
    const ns = stageOf(h, st.weight);
    const prevStage = st.stage; st.stage = ns;
    checkMilestones(h, st, from, st.weight);
    st.stage = prevStage;
    if (ns > st.stage) {
      rep.events.push(`最近、${h.name}の体つきが変わってきた気がする…（${stageInfo(ns).name}）`);
      if (h.stageUpEffect) { st.wary = clamp(st.wary + (h.stageUpEffect.wary || 0), 0, 100); st.aff = clamp(st.aff + (h.stageUpEffect.aff || 0), 0, 100); }
      else if (!favorable(st)) addWary(h, C.waryStageUpLowTrust);
    }
    st.stage = ns;
    if (S.building < 30) st.aff = clamp(st.aff - 1, 0, 100);
    st.habit = clamp(st.habit - C.habitDecayPerDay * mod(h, 'habitDecay'), 0, 1);
    const pk = S.packages[h.id];
    if (pk && S.day - pk.day + 1 >= C.packageExpireDays) {
      delete S.packages[h.id];
      rep.events.push(`${h.name}が、預けたままの荷物を自分で取りに来た。`);
      if (!favorable(st)) st.aff = clamp(st.aff - 2, 0, 100);
    }
    if (isMonthEnd() && !S.rentDone[h.id]) {
      const amt = Math.round(rentOf(h) * (S.building >= 50 ? 1 : 0.8));
      S.money += amt;
      rep.events.push(`${h.name}の家賃 ${yen(amt)} は、郵便受けに封筒で入っていた。`);
    }
    st.wary = clamp(st.wary - C.waryDecayPerNight, 0, 100);
    Object.assign(st, { full: 0, intake: 0, gifts: 0, talked: false, ate: false });
    rep.rows.push({ id: h.id, from, to: st.weight });
  });
  if (S.building < 30) rep.events.push('建物の傷みがひどく、住人たちが不満そうだ。');
  S.building = clamp(S.building - C.buildingDecayPerDay, 0, 100);
  if (isMonthEnd()) S.rentDone = {};
  rep.date = dateText();
  S.day++; S.slot = 0; S.uniToday = false; S.view = { type: 'map' };
  save();
  nightReport = rep;
  openModal('night', nightHTML(rep));
  render();
}

function figure(h, st) {
  // 上限体重（120kg）で最大の太さになるよう、ヒロインの身長ごとに正規化
  const k = clamp((bmi(h, st.weight) - 18) / (bmi(h, maxW(h)) - 18), 0, 1);
  const cx = 100, sh = 34 + k * 14, wa = 22 + k * 54, hip = 36 + k * 44, face = 20 + k * 9, arm = 9 + k * 11, c = esc(h.color || '#d9a0b0');
  return `<svg viewBox="0 0 200 300" role="img" aria-label="${esc(h.name)}の仮シルエット">
    <ellipse cx="${cx - sh - arm * .3}" cy="150" rx="${arm}" ry="52" fill="${c}" opacity=".5"/>
    <ellipse cx="${cx + sh + arm * .3}" cy="150" rx="${arm}" ry="52" fill="${c}" opacity=".5"/>
    <path d="M${cx - sh} 100 Q${cx - sh - 4} 135 ${cx - wa} 165 Q${cx - hip - 8} 192 ${cx - hip} 218 L${cx - hip + 8} 300 L${cx - 5} 300 L${cx} 238 L${cx + 5} 300 L${cx + hip - 8} 300 L${cx + hip} 218 Q${cx + hip + 8} 192 ${cx + wa} 165 Q${cx + sh + 4} 135 ${cx + sh} 100 Q${cx} 88 ${cx - sh} 100Z" fill="${c}" opacity=".8"/>
    ${k > .25 ? `<ellipse cx="${cx}" cy="180" rx="${wa * .85}" ry="${14 + k * 16}" fill="${c}" opacity=".35"/>` : ''}
    <rect x="${cx - 8}" y="70" width="16" height="24" fill="${c}" opacity=".8"/>
    <circle cx="${cx}" cy="52" r="${face}" fill="${c}"/></svg>`;
}
// 立ち絵のパス。ルート（姫華）で差し替え、公開版は軽い形式（window.IMAGE_EXT）に置き換える
function imageOf(h, st) {
  let src = h.images && h.images[st.stage];
  if (h.routes && st.route && st.stage >= (h.routes.fromStage || 1) && h.routes[st.route] && h.routes[st.route][st.stage]) src = h.routes[st.route][st.stage];
  if (src && window.IMAGE_EXT) src = src.replace(/\.png$/, window.IMAGE_EXT);
  return src;
}
function portrait(h, st) {
  const src = imageOf(h, st);
  if (src) return `<div class="figbox"><img src="${esc(src)}" alt="${esc(h.name)}" onerror="this.hidden=true;this.nextElementSibling.hidden=false">
    <div hidden style="width:100%;height:100%">${figure(h, st)}</div></div>`;
  return `<div class="figbox"><span class="tag">仮・段階${st.stage}</span>${figure(h, st)}</div>`;
}
function bodyRows(h, st) {
  const rv = weightReveal(h, st), m = measure(h, st.weight);
  if (rv === 'hidden') return `<div class="row"><span>体重</span><span class="muted">？？kg（まだ教えてくれない）</span></div>`;
  if (rv === 'refuse') return `<div class="row"><span>体重</span><span class="muted">？？kg（「量ってないし」と強がる）</span></div>`;
  const note = rv === 'whisper' ? '<span class="muted">（小声で）</span>' : '';
  return `<div class="row"><span>体重</span><span class="num">${note}${st.weight.toFixed(1)}kg（BMI ${bmi(h, st.weight).toFixed(1)}）</span></div>` +
    (m ? `<div class="row"><span>スリーサイズ</span><span class="num">B${Math.round(m.bust)}(${cupOf(m)})・W${Math.round(m.waist)}・H${Math.round(m.hip)}</span></div>` : '');
}

      <div class="desc">${esc(stageInfo(st.stage).desc || '')}${progressText(h, st) ? '。' + esc(progressText(h, st)) : ''}</div>
      ${st.clothes ? `<div class="desc">服：上 ${CS[st.clothes.top].name}／下 ${CS[st.clothes.bottom].name}。${esc(tightText(h, st))}</div>` : ''}
      <div class="row"><span>満腹</span><span class="num">${st.full}／${st.cap}</span></div>
      <div class="bar full"><i style="width:${st.full / st.cap * 100}%"></i></div>

/* ---------- actions ---------- */
const room = () => H[S.view.id];
const ACT = {
  newgame() {
    S = newState(); screen = 'game'; render();
    narr('祖父が遺したのは、築五十年の木造アパートだった。');
    narr('101号室に住みながら、管理人として住人の面倒を見ることになった。');
    narr('とはいえ、住人たちとはまだ顔見知り程度。用もなく部屋を訪ねるわけにはいかない。');
    narr('朝に敷地を掃除していれば、出かける住人と顔を合わせることもあるだろう。');
  },
  continue() { const d = loadSaved(); if (!d) return; S = d; normalize(); screen = 'game'; render(); narr('続きから再開した。'); },
  menu() { openModal('menu', menuHTML()); },
  close() { closeModal(); },
  saveNow() { closeModal(); narr(save() ? 'セーブしました。' : 'このブラウザでは保存できませんでした。セーブコードを使ってください。'); },
  exportOpen() {
    openModal('export', `<h3>セーブコード</h3><div class="sub">コピーして保管してください。</div>
      <textarea id="exportCode" readonly>${encode(S)}</textarea>
      <div class="acts"><button class="btn" data-act="copyCode">コピー</button><button class="btn" data-act="close">閉じる</button></div>`);
  },
  copyCode() {
    const ta = $('#exportCode');
    navigator.clipboard.writeText(ta.value).then(() => { ta.insertAdjacentHTML('afterend', '<div class="sub">コピーしました</div>'); })
      .catch(() => { ta.focus(); ta.select(); });
  },
  importOpen() {
    openModal('import', `<h3>セーブコードを読み込む</h3><textarea id="importCode" placeholder="ここにコードを貼り付け"></textarea>
      <div id="importErr" class="sub"></div>
      <div class="acts"><button class="btn primary" data-act="doImport">読み込む</button><button class="btn" data-act="close">やめる</button></div>`);
  },
  doImport() {
    try {
      const d = decode($('#importCode').value);
      if (!d || !d.h || !d.day) throw new Error();
      S = d; normalize(); screen = 'game'; closeModal(); render(); narr(`${S.day}日目から再開した。`);
    } catch (e) { $('#importErr').textContent = 'コードを読み取れませんでした。全文が貼り付けられているか確認してください。'; }
  },
  toTitle() { closeModal(); screen = 'title'; Q = []; drawMsg(); render(); },
  devOpen() { openModal('dev', devHTML()); },
  dev(d) {
    if (d.op === 'money') S.money += 10000;
    if (d.op === 'cook') S.cook = Math.min(10, S.cook + 1);
    if (d.op === 'aff') addAff(H[d.id], 10);
    if (d.op === 'kg' || d.op === 'kg10') {
      const h = H[d.id], st = S.h[d.id];
      const from = st.weight;
      st.weight = Math.min(maxW(h), st.weight + (d.op === 'kg' ? 3 : 10));
      checkMilestones(h, st, from, st.weight);
      st.stage = stageOf(h, st.weight);
    }
    if (d.op === 'calm') Object.assign(S.h[d.id], { wary: 0, full: 0 });
    if (d.op === 'night') { closeModal(); S.slot = C.slots.length - 1; advanceSlot(); return; }
    if (d.op === 'monthEnd') { while (!isMonthEnd()) S.day++; S.slot = 3; S.rentDone = {}; closeModal(); render(); narr('月末の夜まで飛ばした。'); return; }
    if (d.op === 'pkg') { S.packages[d.id] = { day: S.day }; }
    if (d.op === 'showAll') S.devShowAll = !S.devShowAll;
    if (d.op === 'route') { const st = S.h[d.id]; st.route = st.route === 'otaku' ? null : 'otaku'; }
    if (d.op === 'bankbook' && !S.bankbook) S.bankbook = 'ready';
    if (d.op === 'aff35') { addAff(H[d.id], 35 - S.h[d.id].aff); }
    render(); openModal('dev', devHTML());
  },
  pick(d) { pickChoice(+d.i); },
  visitRoom(d) {
    const hs = (BY_ROOM[d.key] || []).filter(active);
    openModal('room', `<h3>${esc(d.key.split(':')[1])}号室</h3><div class="sub">誰に会う？</div>
      <div class="acts">${hs.map(h => `<button class="btn wide" data-act="visitPick" data-id="${h.id}" ${present(h) ? '' : 'disabled'}>${esc(h.name)}<small>${present(h) ? '在室中' : '留守'}</small></button>`).join('')}</div>
      <button class="btn close" data-act="close">やめる</button>`);
  },
  visitPick(d) { closeModal(); ACT.visit(d); },
  bankbook() {
    S.bankbook = 'found';
    narr('押し入れの奥、祖父の古い柳行李の底に、見たことのない通帳がしまわれていた。');
    narr('名義は祖父。最後の記帳は、亡くなる半年前の日付だ。');
    narr('残高は……300,000,000円。');
    narr('ゼロの数を三回数え直した。間違いない。三億円だ。');
    narr('通帳には、祖父の字で書かれたメモが挟まっていた。');
    say('祖父のメモ', '「このアパートを大事にしてくれる者へ。隣の空き地も、うちの土地だ。住む場所に困っている人のために、好きに使いなさい」', 'var(--muted)');
    narr('窓の外には、草の伸び放題になった隣の空き地が見えている。');
    render();
  },
  buildMansion() {
    S.bankbook = 'built'; S.mansionBuilt = true;
    S.money += MAN.fundsLeft || 0;
    narr(`祖父の遺したお金で、隣の空き地にマンションを建てることにした。`);
    narr(`鉄筋3階建て、12部屋。名前は「${MAN.name || 'マンション'}」に決めた。`);
    narr('ひだまり荘の住人たちも、新しい建物を見上げて目を丸くしている。');
    const newcomers = D.heroines.filter(h => bldOf(h) === 'mansion' && active(h));
    if (newcomers.length) narr(`さっそく入居者が決まった。${newcomers.map(h => h.name).join('、')}。新しい住人たちとの暮らしが始まる。`);
    else narr('入居者の募集を始めた。（マンションのヒロインはまだ登録されていない）');
    if (MAN.fundsLeft) narr(`残ったお金 ${yen(MAN.fundsLeft)} は、管理費として手元に置いた。`);
    S.view = { type: 'map' }; render();
  },
  tomap() { S.view = { type: 'map' }; render(); },
  self() { S.view = { type: 'self' }; render(); },
  empty(d) { narr(`${d.room}号室。空き部屋だ。修繕すれば入居者を募集できそうだ。（未実装）`); },
  visit(d) {
    const h = H[d.id], st = S.h[h.id];
    if (!present(h)) { narr(`${h.room}号室。…留守のようだ。` + (canVisit(st) ? `（在室しやすい時間：${schedText(h)}）` : '')); return; }
    if (S.packages[h.id]) { deliver(h); return; }
    if (isMonthEnd() && !S.rentDone[h.id]) { collectRent(h); return; }
    if (!canVisit(st)) { narr(`${h.room}号室。…用もないのに訪ねるほどの仲ではない。（親密度${C.visitMinAffection}から訪問できる）`); return; }
    if (!st.captured && st.wary >= C.waryVisitRefuse) { speak(h, 'refuseVisit'); return; }
    S.view = { type: 'room', id: h.id }; st.visits++;
    const since = sinceLastText(st);
    if (since) narr(`（${since}）`);
    st.lastSeenW = st.weight;
    // 優先順：段階アップ ＞ 節目イベント（大きな節目 ＞ 服のサイズアップ ＞ そのほか） ＞ ふつうのあいさつ
    if (st.stage > st.seenStage) {
      const sl = stageReaction(h, st);
      if (sl) say(h.name, sl, h.color);
      else { narr(`（${h.name}の体つきが「${stageInfo(st.stage).name}」になっている）`); speak(h, 'greet'); }
      st.seenStage = st.stage;
    } else if (!playMilestone(h, st)) speak(h, 'greet');
    render();
  },
  talk() {
    const h = room(), st = S.h[h.id];
    st.talked = true;
    addAff(h, C.talkAffection); addWary(h, -C.talkWaryDown);
    if (!tryScene(h, 'talk')) speak(h, 'talk');
    render();
  },
  giftOpen() { openModal('gift', giftHTML(room())); },
  give(d) {
    const h = room(), st = S.h[h.id], f = FOOD[d.id];
    closeModal();
    if (!st.captured && st.wary >= C.waryGiftRefuse) { speak(h, 'wary'); render(); return; }
    const bad = f.tags.filter(t => h.dislikes.includes(t));
    if (bad.length && !favorable(st)) { bad.forEach(t => { st.known[t] = 'dislike'; }); speak(h, 'giftDislike'); addAff(h, -2); render(); return; }
    const warmDislike = bad.length > 0;
    if (st.full + f.full > st.cap) {
      speak(h, 'full'); addWary(h, C.waryOverfull);
      if (st.full >= st.cap * .7) st.cap = Math.min(C.maxCapacity, st.cap + C.stretchOnRefuse);
      render(); return;
    }
    S.inv[d.id]--; if (!S.inv[d.id]) delete S.inv[d.id];
    st.full += f.full; st.intake += f.kcal; st.gifts++;
    st.habit = clamp(st.habit + C.habitPerGift, 0, 1);
    const good = f.tags.filter(t => h.likes.includes(t));
    if (warmDislike) { bad.forEach(t => { st.known[t] = 'dislike'; }); speak(h, h.lines.giftDislikeWarm ? 'giftDislikeWarm' : 'giftNormal'); addAff(h, 1); }
    else if (good.length) { good.forEach(t => { st.known[t] = 'like'; }); speak(h, 'giftLike'); addAff(h, C.giftLikeAffection); }
    else { speak(h, 'giftNormal'); addAff(h, C.giftAffection); }
    narr(`（${f.name}を食べている）`);
    if (!st.captured && st.gifts > C.giftAllowance[tierOf(st.aff)]) { addWary(h, C.waryTooMany); narr('（少し不審がられたようだ）'); }
    stretch(h); render();
  },
  meal(d) {
    const h = room(), st = S.h[h.id], m = D.meals[d.kind];
    if (st.full + m.full > st.cap) { speak(h, 'full'); render(); return; }
    const kcal = Math.round(m.kcal * (d.kind === 'homeCook' ? 1 + C.cookBonus * S.cook : 1));
    S.money -= m.price; st.full += m.full; st.intake += kcal; st.ate = true;
    st.habit = clamp(st.habit + m.habit, 0, 1);
    speak(h, d.kind); addAff(h, m.affection); stretch(h);
    narr(d.kind === 'eatOut' ? '（ふたりで食事をして、部屋まで送った）' : '（ふたりで食卓を囲んだ）');
    S.view = { type: 'map' }; advanceSlot();
  },
  leave() { S.view = { type: 'map' }; advanceSlot(); },
  uni() {
    if (!S.uniToday) { S.uni.went++; S.uniToday = true; }
    narr(pick(['講義を受けた。眠い。', 'ゼミに顔を出した。', '図書館でレポートを進めた。'])); advanceSlot();
  },
  job() { S.money += C.partTimePay; narr(`バイトをした。${yen(C.partTimePay)} を受け取った。`); advanceSlot(); },
  manage() {
    S.building = clamp(S.building + C.manageGain, 0, 100);
    if (slotName() === '朝') { narr('敷地と玄関まわりを掃除した。'); morningGreet(); advanceSlot(); return; }
    narr(pick(['廊下と階段を掃除した。', '雨どいの詰まりを直した。', 'きしむ床板を補修した。'])); advanceSlot();
  },
  shop() { shopBought = false; openModal('shop', shopHTML()); },
  buy(d) {
    const f = FOOD[d.id]; if (S.money < f.price) return;
    S.money -= f.price; S.inv[f.id] = (S.inv[f.id] || 0) + 1; shopBought = true;
    openModal('shop', shopHTML()); render();
  },
  cook() { S.money -= C.cookPracticeCost; S.cook++; narr(`料理の練習をした。料理の腕が ${S.cook} になった。`); advanceSlot(); },
  rest() { if (slotName() === '夜') narr('布団に入った。'); advanceSlot(); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset);
});

/* ---------- boot（公開中の更新でも進行を保つ） ---------- */
window.claude?.hot?.snapshot?.(() => ({ S, screen }));
function start(data) {
  if (data && data.S) { S = data.S; screen = data.screen || 'game'; normalize(); }
  render(); drawMsg();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
