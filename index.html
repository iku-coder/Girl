<title>ひだまり荘 試作版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* 夜のボロアパート：暗い廊下に、在室中の窓だけが灯る。単一のダークテーマで固定 */
:root{
  --ink:#17181f; --panel:#22232d; --panel2:#2b2c38; --line:#3c3d4b;
  --paper:#ece5d6; --muted:#9e99a8; --lamp:#f0b257; --lamp-dim:#8a6328;
  --roof:#3b2d2b; --good:#8fc79a; --bad:#e2867a; --scrim:rgba(8,8,12,.72);
  --display:'Dela Gothic One','Zen Maru Gothic','Hiragino Sans',sans-serif;
  --body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button:focus:not(:focus-visible){outline:none}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6}
/* 背景絵。画像がないときは時間帯の色と建物のシルエットで代わりに描く */
#bg{position:fixed;inset:0;z-index:0;background-color:var(--ink);background-size:cover;background-position:center bottom;background-repeat:no-repeat}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,16,.5),rgba(10,10,16,.8))}
#bg.bright::after{background:linear-gradient(to bottom,rgba(10,10,16,.05),rgba(10,10,16,.6))}
#story{position:fixed;inset:0;z-index:40;background:#000;color:#e9e4da;display:flex;flex-direction:column;justify-content:center;cursor:pointer;
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:40px}
#story .lines{max-width:30em;margin:0 auto;display:grid;gap:14px;font-size:16px;line-height:1.9}
#story .lines p{margin:0;animation:fadein .9s ease both}
#story .lines p.memo{color:#d9b26a}
#story .hint{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;color:#8a857c}
#story .skip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));background:none;border:1px solid #444;color:#aaa;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.who.tut{color:var(--lamp)!important}
.msg.tut{border-color:var(--lamp)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
#hdr{display:flex;align-items:center;gap:8px;padding-block:4px 10px;border-bottom:1px solid var(--line);flex-wrap:nowrap;min-width:0}
.day{font-family:var(--display);font-size:20px;line-height:1}
.day small{font-family:var(--body);font-size:12px;margin-left:2px;color:var(--muted)}
.dow{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pip{font-size:11.5px;padding:1px 5px;border-radius:4px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pips{flex:0 1 auto;min-width:0}
.pip.now{background:var(--lamp);color:var(--ink);border-color:var(--lamp);font-weight:700}
.pip.past{opacity:.35}
@media (max-width:380px){#hdr .dow{display:none}.pip{padding:1px 4px}}
.money{margin-left:auto;font-weight:700}
.icon{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:30px;cursor:pointer}

main{flex:1;min-height:0;overflow-y:auto;padding-block:14px}

/* message */
.msg{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px 12px;min-height:88px;position:relative}
.who{font-size:12px;font-weight:700;color:var(--lamp)}
.txt.narr{color:var(--muted)}
.more{position:absolute;right:12px;bottom:6px;color:var(--lamp);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#tap{position:fixed;inset:0;z-index:20;cursor:pointer}
#block{position:fixed;inset:0;z-index:19;background:var(--scrim);opacity:.45}
.msg.choosing{z-index:21;border-color:var(--lamp)}
.who.me{color:var(--paper)!important;opacity:.75}
.choices{display:grid;gap:6px;margin-top:10px}
.pickbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left;cursor:pointer;line-height:1.45}
.pickbtn:hover{border-color:var(--lamp)}
.pickbtn::before{content:'▸ ';color:var(--lamp)}

/* building */
.bldg{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.roof{background:var(--roof);padding:10px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.roof b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.06em}
.floor{display:grid;grid-template-columns:22px repeat(4,1fr);gap:6px;padding:8px}
.floor+.floor{border-top:1px dashed var(--line)}
.flabel{writing-mode:vertical-rl;font-size:11px;color:var(--muted);align-self:center;letter-spacing:.2em}
.door{aspect-ratio:3/4;background:var(--panel2);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:6px;padding:6px;text-align:left;cursor:pointer;min-width:0}
.door .no{font-size:11px;color:var(--muted)}
.door .win{height:24px;border-radius:2px;background:var(--ink);border:1px solid var(--line)}
.door.lit .win{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 16px var(--lamp-dim)}
.door .nm{font-size:12px;line-height:1.3;word-break:break-all}
.door.self{border-color:var(--lamp-dim)}
.door.empty{opacity:.5}
.bldg.mansion{margin-bottom:12px}
.bldg.mansion .roof{background:var(--panel2)}
.bldg.mansion .door{aspect-ratio:4/5}
.heart{color:var(--bad);margin-right:2px}
.badge{font-size:10px;line-height:1.5;padding:0 5px;border-radius:3px;background:var(--lamp);color:var(--ink);align-self:flex-start}
.badge.off{background:none;color:var(--muted);border:1px solid var(--line)}
.chip.cap{border-color:var(--bad);color:var(--bad)}
.desc{font-size:11px;color:var(--muted);line-height:1.5}
.nameinput{width:100%;margin-top:10px;font:inherit;font-size:18px;padding:8px 10px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:6px}
/* 会話中の立ち絵（左）とステータス（右） */
/* 会話中：立ち絵を画面の下端（背景の地面）まで大きく出し、足元に影。メッセージ欄は半透明で重ねる */
#stage{position:fixed;top:calc(var(--msgH) + 6px);height:calc(100% - var(--msgBase,var(--msgH)) - 6px);left:50%;transform:translateX(-50%);width:min(100%,480px);overflow:hidden;z-index:1;pointer-events:none}
#stage .fig{position:absolute;left:0;right:30%;top:6px;bottom:var(--floor)}
#stage .fig::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:58%;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));z-index:-1}
#stage .fig img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;max-width:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
#stage .fig svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto}
#stage .cast{position:absolute;left:0;right:0;top:6px;bottom:var(--floor)}
#stage .cast .cf{position:absolute;top:0;bottom:0;transform-origin:50% 100%}
#stage .cast .cf img,#stage .cast .cf svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;max-width:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
#stage .cast .cf::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:70%;height:18px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));z-index:-1}
#stage .cast .cf.dim{filter:brightness(.6);transform:scale(.94)}
#stage .stats-card{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12%;width:42%;max-width:210px;pointer-events:auto}
/* 会話中は背景を「地面」の高さまで持ち上げ、足がその上に乗るようにする。ヘッダーは隠して立ち絵を大きく */
:root{--floor:calc(26px + env(safe-area-inset-bottom,0px));--msgH:110px;--msgBase:110px}
/* v2.2：メッセージ欄は画面の上。立ち絵はその下から床まで（顔がテキストのすぐ下に来る） */
#hdr{order:0}#msg{order:1;margin-top:6px}main{order:2}#spacer{order:3}
#bg.talk{bottom:var(--floor)}
#bg.talk::after{background:linear-gradient(to bottom,rgba(10,10,16,.35),rgba(10,10,16,.1) 70%,rgba(10,10,16,0))}
body.talking{background:linear-gradient(to bottom,var(--ink),#0e0e14)}
#app.talking #hdr{display:none}
#app.talking #msg{background:rgba(23,24,31,.72);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);position:relative;z-index:2}
#app.talking #msg.choosing{z-index:21}
#spacer{display:none;flex:1}
#app.talking #spacer{display:block}
#stage .fig svg{height:100%;max-width:100%}
.stats-card{align-self:center;background:rgba(23,24,31,.86);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:5px;font-size:13px;min-width:0}
.stats-card h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.3}
.stats-card .eye{font-size:10px;letter-spacing:.15em;color:var(--lamp)}
.stats-card .kv{display:flex;justify-content:space-between;gap:6px}
.stats-card .kv span:first-child{color:var(--muted);white-space:nowrap}
.stats-card .big{font-size:18px;font-weight:700}
.roomstage{position:relative;height:max(380px,62vh);margin-inline:-4px}
.roomstage .fig{position:absolute;left:0;right:30%;top:0;bottom:0}
.roomstage .fig::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:58%;height:20px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));z-index:-1}
.roomstage .fig img,.roomstage .fig svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;max-width:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.roomstage .stats-card{position:absolute;right:0;top:8%;width:44%;max-width:210px}
.roomacts{margin-top:10px}
.roominfo{margin-top:12px;background:rgba(23,24,31,.85);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.roster{display:grid;margin-top:8px}
.rrow.link{cursor:pointer}
.wx{font-size:11px;margin-left:6px;color:var(--muted)}
.bubble{background:var(--panel2);border-radius:12px;padding:8px 12px;margin:8px 0;max-width:85%;font-size:14px;line-height:1.6}
.bubble.me{margin-left:auto;background:var(--lamp);color:var(--ink)}.bubble .photo{margin-top:6px;font-size:12px;color:var(--muted)}
.card3.sel{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp) inset}
button.card3{color:inherit;font:inherit;text-align:left;cursor:pointer}
.opt{display:flex;gap:8px;align-items:center;font-size:13px;margin:8px 0}
.evlist{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.card3{border:1px solid var(--line);border-radius:8px;padding:7px 6px;display:flex;flex-direction:column;gap:2px;background:var(--panel);min-width:0}
.card3 b{font-size:13px;font-weight:600;line-height:1.3;word-break:break-all}.card3 small{font-size:10.5px;color:var(--muted);line-height:1.35}
.card3 .num{font-size:12.5px;margin-top:auto}.card3 .mini{width:100%;margin-top:3px}.card3 .chip{align-self:flex-start}
.card3.over{opacity:.55}.card3 .up{color:#e0915a}
.item.pick{width:100%;text-align:left;background:none;color:inherit;font:inherit;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.item.pick.on{background:var(--panel2)}.item.pick.on .num{color:var(--lamp);font-weight:700}
.gal{margin-top:10px}.gthumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:4px}
.gth{aspect-ratio:2/3;position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0;color:inherit}
.gth img{width:100%;height:100%;object-fit:cover;object-position:top}
.gth span{position:absolute;left:3px;bottom:1px;font-size:10px;text-shadow:0 1px 2px #000}.gth.locked{opacity:.3;display:block}
.galbig{text-align:center}.galbig img{max-width:100%;max-height:62vh;object-fit:contain}
.ending p{margin:.5em 0;line-height:1.8}.rrow.link:active{background:var(--panel2)}
.diary-chart{width:100%;height:120px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.drow{padding:7px 0;border-bottom:1px solid var(--line);display:grid;gap:2px}
.drow .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.drow .l1 b{font-size:15px}
.drow .l2{font-size:12px;color:var(--muted)}.drow .up{color:#e0915a}.drow .down{color:#6fa8dc}
.drow .chg{font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2)}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rname{display:grid;min-width:0}.rname b{font-weight:500}.rname small{font-size:11px}
.rval{display:grid;text-align:right;line-height:1.2}.rval b{font-size:17px}.rval small{font-size:10px;color:var(--muted)}
.changes{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.changes summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.changes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px;font-size:13px}
.changes li b{color:var(--lamp);font-weight:500}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.stats{display:grid;gap:10px;margin-top:16px;background:rgba(23,24,31,.82);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.legend{background:rgba(23,24,31,.7);border-radius:6px;padding:4px 8px}
.stat{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--lamp)}
.bar.full i{background:var(--good)}
.bar.low i{background:var(--bad)}

/* room */
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 2px;letter-spacing:.03em;text-wrap:balance}
.sub{font-size:12px;color:var(--muted)}
.portrait{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:start}
.figbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;aspect-ratio:2/3;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.figbox img{width:100%;height:100%;object-fit:cover}
.figbox svg{width:100%;height:100%}
.figbox .tag{position:absolute;top:4px;left:4px;font-size:10px;color:var(--muted);background:var(--ink);padding:0 4px;border-radius:3px}
.info{display:grid;gap:7px;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.row>span:first-child{white-space:nowrap}
.row>span:last-child{text-align:right}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.chip.like{border-color:var(--good);color:var(--good)}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.btn small{color:var(--muted);font-size:11px;line-height:1.4}
.btn:disabled{opacity:.36;cursor:default}
.btn.primary{background:var(--lamp);color:var(--ink);border-color:var(--lamp)}
.btn.primary small{color:var(--ink);opacity:.75}
.btn.wide{grid-column:1/-1}
.back{margin-top:14px;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 0;font-size:13px}

/* title */
.title{min-height:100%;text-shadow:0 2px 12px rgba(0,0,0,.8);display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:24px}
.kicker{font-size:12px;letter-spacing:.2em;color:var(--lamp)}
.title h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.1;margin:0;letter-spacing:.06em}
.title p{margin:0;color:var(--paper);max-width:30em}
.title .btn:disabled{opacity:.55;background:rgba(43,44,56,.85)}
.stack{display:grid;gap:8px;max-width:320px}

/* modal */
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--panel);width:100%;max-width:480px;max-height:86%;overflow-y:auto;border-radius:14px 14px 0 0;border:1px solid var(--line);border-bottom:none;
  padding-top:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h3{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:17px}
.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--muted);font-size:11px}
.mini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 12px;cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.nrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.up{color:var(--lamp)}
textarea{width:100%;min-height:90px;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,monospace;font-size:11px;padding:8px}
.sheet .close{margin-top:14px;width:100%}
.dev{display:grid;gap:6px}
.dev .rowb{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){.more{animation:none}#story .lines p{animation:none}}
</style>

<div id="bg" aria-hidden="true"></div>
<div id="app">
  <header id="hdr" hidden></header>
  <main id="main"></main>
  <div id="spacer" aria-hidden="true"></div>
  <section id="stage" hidden aria-live="polite"></section>
  <div class="msg" id="msg" aria-live="polite"></div>
</div>
<div id="tap" hidden aria-label="次へ"></div>
<div id="block" hidden></div>
<div id="modal" hidden></div>
<div id="story" hidden role="dialog" aria-label="プロローグ"></div>

<script src="data.js"></script>
<script src="heroines.js"></script>
<script src="life.js"></script>
<script src="scenes.js"></script>
<script>window.SCENE_ADDS = []; window.addScenes = (id, list, extra) => window.SCENE_ADDS.push({ id, list, extra });
window.EAT_LINES = {}; window.addEatLines = (id, o) => { window.EAT_LINES[id] = o; };
window.PHONE = {}; window.addPhone = (id, list) => { window.PHONE[id] = (window.PHONE[id] || []).concat(list || []); };
window.BODY = {}; window.addBody = (id, o) => { window.BODY[id] = o; };
window.EXTRA = {}; window.addExtra = (id, o) => { const e = window.EXTRA[id] = window.EXTRA[id] || { lines: {} }; if (o.birthday) e.birthday = o.birthday; Object.assign(e.lines, o.lines || {}); };</script>

<script>
(() => {
'use strict';
const D = window.GAME_DATA, C = D.config;
const SAVE_KEY = 'hidamari_save_v1';
const H = Object.fromEntries(D.heroines.map(h => [h.id, h]));
const bldOf = h => h.building || 'apartment';
const BY_ROOM = {};   // 'apartment:102' → [ヒロイン…]（双子は同じ部屋に2人）
D.heroines.forEach(h => { (BY_ROOM[bldOf(h) + ':' + h.room] = BY_ROOM[bldOf(h) + ':' + h.room] || []).push(h); });
const MAN = C.mansion || {};
// マンションの住人は、マンションが建つまで登場しない
const active = h => {
  if (bldOf(h) === 'mansion' && !(S && S.mansionBuilt)) return false;
  const a = h.appearIf;   // 登場条件（莉緒：ひなたが段階9以上）
  if (a && S && !(S.h[a.heroine] && S.h[a.heroine].stage >= (a.minStage || 1)) && !(S.h[h.id] && S.h[h.id].arrived)) return false;
  if (a && S && S.h[h.id]) S.h[h.id].arrived = true;   // 一度来たら、条件が外れても居続ける
  return true;
};
const HS = () => D.heroines.filter(active);
const rentOf = h => h.rent || (bldOf(h) === 'mansion' ? MAN.rentPerMonth : C.rentPerMonth) || C.rentPerMonth;
const FOOD = Object.fromEntries(D.foods.map(f => [f.id, f]));
// 作り置きは「prep_<料理id>」という差し入れとして持ち歩ける
const RECIPES = D.recipes || [];
RECIPES.forEach(r => { FOOD['prep_' + r.id] = { id: 'prep_' + r.id, name: '作り置きの' + r.name, price: 0, kcal: r.kcal, full: r.full, tags: r.tags, prep: true }; });
const knownRecipes = () => RECIPES.filter(r => (S.cook || 0) >= r.minSkill);
const cookMax = () => C.cookMax || 500;
const $ = s => document.querySelector(s);

let S = null, screen = 'title';
let Q = [], incoming = [], settled = true, flushPending = false;
let modalKind = null, shopBought = false, nightReport = null;

/* ---------- helpers ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const pick = a => a[Math.floor(Math.random() * a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slotName = () => C.slots[S.slot];
const dateOf = day => { const d = new Date((C.startDate || '2026-04-01') + 'T00:00:00'); d.setDate(d.getDate() + day - 1); return d; };
const dow = () => (dateOf(S.day).getDay() + 6) % 7;
const isMonthEnd = () => dateOf(S.day + 1).getDate() === 1;
const dateText = (day = S.day) => { const d = dateOf(day); return `${d.getMonth() + 1}/${d.getDate()}`; };
const favorable = st => st.captured || st.aff >= C.favorableFrom;
const canVisit = st => st.captured || st.aff >= C.visitMinAffection;
const mod = (h, k) => (h.mods && h.mods[k] != null ? h.mods[k] : 1);
const isWeekend = () => dow() >= 5;
const bmi = (h, w) => w / ((h.height / 100) ** 2);
const stageOf = (h, w) => { const b = bmi(h, w); return (D.stages.find(s => b < s.maxBmi) || D.stages[D.stages.length - 1]).id; };
const stageInfo = id => D.stages.find(s => s.id === id);
const tierOf = aff => { let t = 0; D.affectionTiers.forEach((x, i) => { if (aff >= x.min) t = i; }); return t; };
// 凛の交代制（4日周期）：0 日勤（朝・夜に在室）1 夜勤（昼）2 明け・非番（朝・昼・夕）3 休み（昼・夕・夜）
const RIN_SHIFT = [['朝', '夜'], ['昼'], ['朝', '昼', '夕'], ['昼', '夕', '夜']];
const rinShift = (day = S.day) => ((day - 1) % 4 + 4) % 4;
const present = h => {
  const st = S && S.h && S.h[h.id];
  if (st && st.away && S.day <= st.away.until) return false;   // 留守（栞の夫の一時帰国など）
  if (st && st.sick && slotName() !== '深夜') return true;       // 風邪で寝込んでいる（E3）
  // 深夜：会えるのは攻略した住人だけ（夜に部屋にいる人。真理子は仕事帰り）
  if (slotName() === '深夜') return !!(st && lateOk(st)) && (h.id === 'mariko' || (h.id === 'rin' ? RIN_SHIFT[rinShift()].includes('夜') : (h.schedule[isWeekend() ? 'weekend' : 'weekday'] || []).includes('夜')));
  if (st && st.extraSlot && st.extraSlot.day === S.day && st.extraSlot.slot === slotName()) return true;   // 雨の日は家にいる（S1）
  if (h.id === 'rin') return RIN_SHIFT[rinShift()].includes(slotName());
  return (h.schedule[isWeekend() ? 'weekend' : 'weekday'] || []).includes(slotName());
};
const schedText = h => `平日 ${h.schedule.weekday.join('・')}／休日 ${h.schedule.weekend.join('・')}`;
const maxW = h => (h && h.maxWeight) || C.maxWeight || 120;
const invCount = () => Object.values(S.inv).reduce((a, b) => a + b, 0);

/* ---------- 体のサイズ・服・節目（1kg単位の変化） ---------- */
const CS = C.clothingSizes || [];
const fatOf = h => (h.bodyType && h.bodyType.fat) || 'hidden';
const rateOf = h => h.sizeRates || (h.bodyType && C.sizeRates && C.sizeRates[h.bodyType.frame + '_' + h.bodyType.fat]) || { bust: 0.7, waist: 1.1, hip: 0.85 };
function measure(h, w) {
  if (!h.sizes) return null;
  const s = h.sizes, r = rateOf(h), d = w - h.weight;
  const w39 = (C.waistExtraFromBmi || 39) * (h.height / 100) ** 2;
  const extra = Math.max(0, w - Math.max(h.weight, w39));
  return { bust: s.bust + r.bust * d, under: s.under + (C.underRate || 0.45) * d,
    waist: s.waist + r.waist * d + (C.waistExtra || 0.2) * extra, hip: s.hip + r.hip * d };
}
const CUPS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const cupOf = m => { const i = Math.round((m.bust - m.under - 10) / 2.5); return i < 0 ? 'AA' : CUPS[Math.min(i, CUPS.length - 1)]; };
const fitIdx = (part, v) => { const i = CS.findIndex(c => c[part] >= v); return i < 0 ? CS.length - 1 : i; };
const needTop = m => fitIdx('bust', m.bust);
const needBottom = m => Math.max(fitIdx('waist', m.waist), fitIdx('hip', m.hip));
function tightText(h, st) {
  const m = measure(h, st.weight); if (!m || !st.clothes) return '';
  if (fatOf(h) === 'hidden' && st.stage < 4) return C.tightness[0].text;
  const top = CS[st.clothes.top], bot = CS[st.clothes.bottom], f = fatOf(h);
  const room = f === 'apple' ? bot.waist - m.waist : f === 'pear' ? bot.hip - m.hip

/* ---------- 身体の変化（v2.1） ---------- */
const bodyGroup = st => (st.stage <= 4 ? 0 : st.stage <= 8 ? 1 : st.stage <= 12 ? 2 : 3);
function bodyState(h, st) {

  const tight = /しわ|弾けそう/.test(tightText(h, st) || '');
  B.items.forEach(it => {
    let g = sg;
    if (it.lateHidden && fat === 'hidden') g = Math.max(0, g - 1);   // 隠れ肥満型：1グループ遅れて出る
    if (it.id === 'smell') { if (fat === 'hidden' && sg === 1) g = 0; if (g >= 1 && (B.summer.includes(mo) || hotDay())) g = Math.min(3, g + 1); if (B.winter.includes(mo)) g = Math.max(0, g - 1); }
    if (it.id === 'dark' && tight && g >= 1) g = Math.min(3, g + 1);   // 服がきついと擦れが進む
    if (!g) return;
    const where = ((B.where || {})[it.id] || {})[fat] || '';
    let text = it.text[g].split('{where}').join(where);

  if (HS().some(h => S.h[h.id].dietNew)) r.push('ダイエット宣言');
  if (HS().some(h => { const st = S.h[h.id], b = snap[h.id] || {}; return st.met && (st.stage > (b.stage || 0) || (st.pend || []).length > (b.pend || 0)); })) r.push('体型の変化・節目');
  if (S.money < ((C.autoPlan || {}).stopMoney || 3000)) r.push('お金が少ない');
  if (S.pendingEnding) r.push('年度の終わり');
  if ((S.morningNotes || []).length) r.push('税金の知らせ');
  if (Object.values(S.req || {}).some(q => q.until - S.day <= 1)) r.push('依頼の期限が明日');
  if (S.autoBreak && S.autoBreak.length) { r.push(...S.autoBreak); S.autoBreak = []; }   // 夜の集計で積まれた「止まる理由」
  window.AUTO_STOPS.forEach(f => { const x = f(); if (x) r.push(x); });
  return r;
}

function autoDay() {
  const wk = dow() < 5, pay = C.partTimePay;
  S.building = clamp(S.building + C.manageGain * 2, 0, 100);
  if (wk && !S.graduated) { S.uni.went++; S.uniToday = true; (S.sem = S.sem || { went: 0, total: 0 }).went++; S.money += pay; } else S.money += pay * 2;
  if (S.autoGift) {
    let budget = (C.autoPlan || {}).giftBudget || 3000;
    HS().forEach(h => {
      const st = S.h[h.id];
      // F1 まだ訪ねられない人には、ドアノブの差し入れ（好物を1品）
      if (st.met && !st.captured && st.aff < 35 && C.doorGift && st.wary < C.doorGift.refuseWary && !st.diet && !(st.door && st.door.day === S.day)) {
        const g = D.foods.filter(f => !f.leftover && f.price <= budget && f.price <= S.money && f.tags.some(t => isLike(h, st, t))).sort((a, b) => b.kcal - a.kcal)[0];
        if (g) { budget -= g.price; S.money -= g.price; st.door = { day: S.day, food: g.id }; (S.autoLog = S.autoLog || []).push(g.id); }
        return;
      }
      if (!st.met || st.aff < 35 || st.diet || (!st.captured && st.wary >= C.waryGiftRefuse)) return;
      const f = D.foods.filter(f => !f.leftover && f.price <= budget && f.price <= S.money && f.tags.some(t => isLike(h, st, t)) && st.full + f.full <= capOf(st)).sort((a, b) => b.kcal - a.kcal)[0];
      if (!f) return; st.lastSeen = S.day;
      budget -= f.price; S.money -= f.price; st.full += f.full; st.intake += f.kcal; st.gifts++; st.habit = clamp(st.habit + C.habitPerGift, 0, 1);
      f.tags.forEach(t => { if (isLike(h, st, t)) st.known[t] = 'like'; }); addAff(h, C.giftLikeAffection);
      (S.autoLog = S.autoLog || []).push(f.id);
    });
  }
}

  give(d) {
    const h = room(), st = S.h[h.id], f = FOOD[d.id];
    const forced = S.giftMode === 'hinata';   // 莉緒：ひなたと一緒なら、警戒に関係なく食べる
    closeModal();
    if (!forced && !st.captured && st.wary >= C.waryGiftRefuse) { sfx('refuse'); speak(h, 'wary'); render(); return; }
    dietStopCheck(h, st);
    if (!forced && st.diet) { speak(h, 'dietRefuse'); render(); return; }
    // すみれ：デザインに没頭中は、受け取ってため込む（完成の日にまとめて食べる）
    if (h.id === 'sumire' && st.focus) {
      S.inv[d.id]--; if (!S.inv[d.id]) delete S.inv[d.id];
      st.stash = (st.stash || 0) + f.kcal; st.gifts++; addAff(h, C.giftAffection);
      speak(h, 'focusGift'); narr(`（${f.name}は、作業机の横の山に積まれた。ため込んだ差し入れ：${Math.round(st.stash)}kcal）`);
      render(); return;
    }
    if (f.care) {   // ケア用品（v2.1）：カロリー0。好意以上で+2、恥じらい期は+3、受け入れ期は「塗ってくれる？」
      S.inv[d.id]--; if (!S.inv[d.id]) delete S.inv[d.id];
      const g = bodyGroup(st), hi = st.aff >= 70 || st.captured;
      speak(h, hi && g === 3 ? 'careGiftAccept' : hi && g === 2 ? 'careGiftShy' : 'careGift');
      addAff(h, hi ? (g === 2 ? 3 : 2) : 1);
      if (hi && g === 3) narr(`（${shortName(h)}の背中に、${f.name}を塗ってあげた）`);
      render(); return;
    }
    const bad = f.tags.filter(t => isDislike(h, st, t));

    const warmDislike = bad.length > 0;
    if (st.full + f.full > capOf(st)) {
      if (!eatSay(h, 'full')) speak(h, 'full'); addWary(h, C.waryOverfull);
      if (st.full >= capOf(st) * .7) st.cap = Math.min(C.maxCapacity, st.cap + C.stretchOnRefuse);
      render(); return;
    }
    S.inv[d.id]--; if (!S.inv[d.id]) delete S.inv[d.id];
    const tr = eatTrack(h, st, f.id);   // 飽き・ハマり（S2）
    const kcalG = Math.round(f.kcal * giftMul(h, st, f) * (tr === 'bored' ? 0.8 : 1));
    st.full += f.full; st.intake += kcalG; st.gifts++; sfx('gift'); (st.tagsToday = st.tagsToday || []).push(...f.tags);
    aoiJealous(h);
    if (h.id === 'himeka' && st.order === f.id) { st.order = null; speak(h, 'orderOk'); addAff(h, 4); }
    // 深夜の差し入れ（夜食）は、物によって胃袋（満腹ゲージの上限）が少し広がる
    if (slotName() === '深夜' && f.night && st.cap < C.maxCapacity) { const nx = Math.round(f.night * (isCheat(st) ? (C.cheatDay.nightRate || 1.5) : 1)); st.cap = Math.min(C.maxCapacity, st.cap + nx); narr(`（深夜の${f.name}。…胃袋が少し広がった気がする。満腹の上限 +${nx}）`); }
    if ((hotDay() && f.tags.includes('cold')) || (coldDay() && f.tags.includes('hot'))) { addAff(h, 2); speak(h, hotDay() ? 'hotDay' : 'coldDay'); }
    if (h.id === 'karen' && karenCheat(st)) narr('（今日はチートデイ。差し入れはいつもの倍、おいしく食べてもらえる）');
    if (h.id === 'aoi' && st.yake === S.day) narr('（やけ食いの勢いで、いつもより多く食べている）');
    // 双子のおすそわけ（もう1人が部屋にいるとき）
    if (h.twinOf && H[h.twinOf] && present(H[h.twinOf]) && S.h[h.twinOf]) {
      const tw = S.h[h.twinOf], r = h.id === 'mio' && st.stage - tw.stage >= 2 ? 0.5 : 0.3, k = Math.round(kcalG * r);
      st.intake -= k; tw.intake += k;
      narr(`（${shortName(H[h.twinOf])}が「おすそわけ」と言って、${Math.round(r * 10)}割ほど食べた）`);
    }
    st.habit = clamp(st.habit + C.habitPerGift, 0, 1);
    const good = f.tags.filter(t => isLike(h, st, t));
    if (tr === 'bored') { speak(h, 'bored'); }
    else if (tr === 'hooked' || (st.hooked || {})[f.id]) { if (tr === 'hooked') speak(h, 'hooked'); else speak(h, 'giftLike'); addAff(h, C.giftLikeAffection); }
    else if (warmDislike) {
      bad.forEach(t => { st.known[t] = 'dislike'; });
      speak(h, 'giftDislikeWarm'); addAff(h, 1);
      // 何度か食べるうちに、苦手だった物が好きになる
      bad.forEach(t => {
        st.ateDisliked = st.ateDisliked || {}; st.ateDisliked[t] = (st.ateDisliked[t] || 0) + 1;
        if (st.ateDisliked[t] >= (C.acquireAfter || 3)) {
          (st.acquired = st.acquired || {})[t] = true; st.known[t] = 'like';
          narr(`（${h.name}は、前は苦手だった${C.tagNames[t] || t}を、すっかりおいしそうに食べるようになった）`);
          st.rep = [{ day: S.day, text: `苦手だった${C.tagNames[t] || t}が好きになった` }].concat(st.rep || []).slice(0, C.reputationKeep || 4);
        }
      });
    }
    else if (good.length) { good.forEach(t => { st.known[t] = 'like'; }); speak(h, 'giftLike'); addAff(h, C.giftLikeAffection); }
    else { speak(h, 'giftNormal'); addAff(h, C.giftAffection); }
    if (Math.random() < (C.eatGiftChance == null ? 1 : C.eatGiftChance)) eatSay(h, 'gift');
    narr(`（${f.name}を食べている）`);
    if (!forced && !st.captured && st.gifts > C.giftAllowance[tierOf(st.aff)]) { addWary(h, C.waryTooMany); narr('（少し不審がられたようだ）'); }
    if (forced && st.rhDay !== S.day) { st.rhDay = S.day; if (!withCastTry(['rio', 'hinata'], h, 'rioHinata')) narr('（ひなたに「一緒に食べよ？」と言われて、莉緒はしぶしぶ口に運んだ）'); addAff(H.hinata, 1); }
    S.giftMode = null;
    stretch(h); render();

    openModal('prep', `<h3>作り置き</h3><div class="sub">${prepN()}食分を作って、差し入れとして持っておく。所持金 ${yen(S.money)}</div>
      ${knownRecipes().slice().reverse().map(r => `<div class="item"><div>${esc(r.name)}<small>${r.kcal}kcal・満腹+${r.full}・所持 ${S.inv['prep_' + r.id] || 0}</small></div>
        <span class="num">${yen(r.cost * prepN())}</span><button class="mini" data-act="prep" data-recipe="${r.id}" ${S.money >= r.cost * prepN() ? '' : 'disabled'}>作る</button></div>`).join('')}
      <button class="btn close" data-act="close">やめる</button>`);
  },
  prep(d) {
    const r = RECIPES.find(x => x.id === d.recipe); if (!r) return;
    closeModal();
    S.money -= r.cost * prepN();
    S.inv['prep_' + r.id] = (S.inv['prep_' + r.id] || 0) + prepN();
    narr(`「${r.name}」を${prepN()}食分作り置きした。差し入れとして住人に渡せる。`);
    advanceSlot();
  },
  rest() {
    if (slotName() === '深夜') {
      const mk = H.mariko, ms = S.h.mariko, rn = H.rin, rs = S.h.rin;
      if (rn && rs && rs.met && active(rn) && !rs.captured && rinShift() === 2 && rs.stakeDay !== S.day && Math.random() < 0.3 && pickScene(rn, 'stakeout')) {
        rs.stakeDay = S.day; narr('（コンビニへ行こうと外に出ると、電柱の陰に見覚えのある人影があった）'); tryScene(rn, 'stakeout');
      } else if (mk && ms && ms.met && active(mk) && ms.aff >= 35 && Math.random() < 0.15 && pickScene(mk, 'lateNight')) {
        narr('（深夜。布団に入りかけたところで、戸をたたく音がした）'); ms.intake += 600; tryScene(mk, 'lateNight');
      } else narr('布団に入った。');
    }
    advanceSlot();
  }
};

// 成長日記の「目標の体型」
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.chg || !S) return;
  if (el.dataset.chg === 'mybday' || el.dataset.chg === 'mybdayD') { const [m, d] = myBday().split('-'); S.myBirthday = el.dataset.chg === 'mybday' ? String(el.value).padStart(2, '0') + '-' + d : m + '-' + String(el.value).padStart(2, '0'); save(); return; }
  const st = S.h[el.dataset.id]; st.target = +el.value || null; st.targetHit = !!(st.target && st.stage >= st.target); if (!st.target) st.keep = false; save();
});
// 自分の効果音を鳴らす操作（ボタンの共通音を重ねない）
const QUIET_ACT = ['visit', 'give', 'buy', 'meal', 'doorHang', 'refill'];
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn && !QUIET_ACT.includes(b.dataset.act)) sfx(b.dataset.act === 'close' || b.classList.contains('back') ? 'cancel' : 'select');
  if (fn && S && S.sceneBgStale) clearSceneBg();   // 次の行動に移ったら、前の出先の背景を戻す
  if (fn) fn(b.dataset);
});

/* ---------- boot（公開中の更新でも進行を保つ） ---------- */
window.claude?.hot?.snapshot?.(() => ({ S, screen }));
function start(data) {
  if (data && data.S) { S = data.S; screen = data.screen || 'game'; normalize(); }
  render(); drawMsg();
  initCloud();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
// 自動テスト用の窓口（ゲームの動作には影響しない）
window.__hidamari = { get S() { return S; }, ACT, H, C, D, SC, night: s => night(s), render: () => render(), stage: id => stageOf(H[id], S.h[id].weight), tier: a => tierOf(a), HS: () => HS().map(h => h.id), SND };
})();
</script>
